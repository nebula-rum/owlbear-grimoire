<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Owlbear's toolbar renders extension action icons as flat white line
       art — it ignores fill/stroke colors entirely, so this is drawn with
       bold, uncluttered strokes and no reliance on fill so it stays legible
       at real toolbar size (confirmed against a live screenshot). -->
  <g fill="none" stroke="#f2f1f6" stroke-linecap="round" stroke-linejoin="round">
    <rect x="5" y="5" width="22" height="24" rx="2.5" stroke-width="2.4"/>
    <path d="M11 5 V29" stroke-width="2"/>
    <path d="M20 5 V16 L17 13 L14 16 V5" stroke-width="2"/>
  </g>
</svg>
