<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Grimoire Viewer</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body class="viewer-body">
    <div id="app">
      <div id="loading" class="loading">Loading…</div>
    </div>
    <script>
      setTimeout(function () {
        var el = document.getElementById("loading");
        if (el) {
          el.textContent =
            "Still loading after 8s — try a hard refresh (Ctrl/Cmd+Shift+R), then check the browser console for errors.";
        }
      }, 8000);
    </script>
    <script type="module" src="/src/viewer.ts"></script>
  </body>
</html>
